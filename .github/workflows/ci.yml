name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lightweight-checks:
    name: Lightweight Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests (no GPU)
        # Windows exercises dependency markers and platform branches that Linux
        # never reaches; the CLI tests currently fail there on path resolution,
        # so it reports without blocking until those are fixed.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        run: uv run --extra test pytest -m "not gpu" -v
